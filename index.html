<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNZA Timetable • 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        :root { --unza-blue: #003087; }
        
        * { transition: all 0.25s ease; }
        .header-font { font-family: 'Space Grotesk', sans-serif; }
        
        .table-row:hover {
            background-color: #f0f7ff;
            transform: scale(1.02) translateY(-3px);
        }
        
        .modal {
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.8) translateY(50px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <header class="bg-gradient-to-r from-[#003087] to-[#0048a8] text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between" id="logoContainer">
            <!-- Logo & Title loaded from JSON -->
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <h1 class="header-font text-5xl font-bold text-[#003087] text-center md:text-left">Academic Timetable 2026</h1>
        <p class="text-center md:text-left text-gray-600 mt-2">The University of Zambia</p>

        <!-- Search -->
        <div class="mt-10 flex flex-col md:flex-row gap-4">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-6 top-5 text-gray-400"></i>
                <input id="searchInput" type="text" placeholder="Search course, lecturer, class rep..." 
                       class="w-full pl-14 py-5 rounded-3xl border border-gray-300 focus:border-[#003087] text-lg"
                       onkeyup="if(event.key === 'Enter') performSearch()">
            </div>
            <button onclick="performSearch()" class="bg-[#003087] text-white px-10 py-5 rounded-3xl font-semibold">SEARCH</button>
            <button onclick="resetFilters()" class="px-6 py-5 text-gray-500">Reset</button>
        </div>

        <!-- Day Filters -->
        <div class="flex flex-wrap gap-3 my-8" id="dayFilters"></div>

        <!-- Table -->
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
            <table class="w-full">
                <thead class="bg-[#003087] text-white">
                    <tr>
                        <th class="px-6 py-6 text-left">Day</th>
                        <th class="px-6 py-6 text-left">Time</th>
                        <th class="px-6 py-6 text-left">Course</th>
                        <th class="px-6 py-6 text-left">Lecturer</th>
                        <th class="px-6 py-6 text-left">Class Representative</th>
                        <th class="px-6 py-6 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="timetableBody" class="divide-y"></tbody>
            </table>
        </div>
    </main>

    <!-- Search Modal -->
    <div id="searchModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 px-4">
        <div class="modal bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-hidden">
            <div class="bg-[#003087] text-white px-8 py-6 flex justify-between">
                <h3 class="text-2xl font-semibold">Search Results</h3>
                <button onclick="closeModal()" class="text-4xl">×</button>
            </div>
            <div id="modalContent" class="p-8 overflow-auto max-h-[65vh]"></div>
        </div>
    </div>

    <script>
        let timetableData = [];

        async function loadData() {
            try {
                const response = await fetch('lectures.json');
                if (!response.ok) throw new Error("File not found");
                
                const data = await response.json();
                timetableData = data.timetable || [];

                // Load Logo
                const logoPath = data.logo || 'images/logo.png';
                document.getElementById('logoContainer').innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-white rounded-3xl p-2 shadow-inner">
                            <img src="${logoPath}" alt="UNZA Logo" class="w-full h-full object-contain">
                        </div>
                        <div>
                            <h1 class="header-font text-4xl tracking-tighter">University of Zambia</h1>
                            <p class="text-blue-200">Student Timetable Portal</p>
                        </div>
                    </div>
                `;

                renderDayFilters();
                renderTimetable(timetableData);
            } catch (err) {
                console.error(err);
                document.getElementById('logoContainer').innerHTML = `
                    <p class="text-red-300">⚠️ Could not load lectures.json. Please make sure the file exists.</p>
                `;
            }
        }

        function renderDayFilters() {
            const container = document.getElementById('dayFilters');
            container.innerHTML = `<div onclick="filterByDay('all')" id="filter-all" class="px-7 py-3 bg-[#003087] text-white rounded-3xl cursor-pointer font-medium">ALL COURSES</div>`;

            const days = [...new Set(timetableData.map(item => item.day))];
            days.forEach(day => {
                const div = document.createElement('div');
                div.textContent = day;
                div.id = `filter-${day}`;
                div.className = "px-7 py-3 bg-white border border-gray-300 hover:border-[#003087] rounded-3xl cursor-pointer font-medium";
                div.onclick = () => filterByDay(day);
                container.appendChild(div);
            });
        }

        function renderTimetable(data) {
            const tbody = document.getElementById('timetableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const row = document.createElement('tr');
                row.className = "table-row";
                row.innerHTML = `
                    <td class="px-6 py-7 font-medium">${item.day}</td>
                    <td class="px-6 py-7"><span class="bg-blue-100 text-blue-700 px-5 py-2 rounded-3xl text-sm">${item.time}</span></td>
                    <td class="px-6 py-7 font-medium">${item.course}</td>
                    <td class="px-6 py-7 whitespace-pre-line">${item.lecturer}</td>
                    <td class="px-6 py-7 whitespace-pre-line">${item.classRep}</td>
                    <td class="px-6 py-7 text-center">
                        <button onclick="messageRep('${item.classRep.split('\n')[0]}')" class="bg-emerald-600 text-white px-6 py-3 rounded-3xl text-sm hover:bg-emerald-700">
                            Message Rep
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function filterByDay(day) {
            document.querySelectorAll('#dayFilters > div').forEach(el => el.classList.remove('bg-[#003087]', 'text-white'));
            if (day === 'all') {
                document.getElementById('filter-all').classList.add('bg-[#003087]', 'text-white');
                renderTimetable(timetableData);
            } else {
                document.getElementById(`filter-${day}`).classList.add('bg-[#003087]', 'text-white');
                renderTimetable(timetableData.filter(item => item.day === day));
            }
        }

        function performSearch() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!term) return;
            const results = timetableData.filter(item => 
                item.course.toLowerCase().includes(term) || 
                item.lecturer.toLowerCase().includes(term) ||
                item.classRep.toLowerCase().includes(term)
            );
            showSearchModal(results);
        }

        function showSearchModal(results) {
            const modal = document.getElementById('searchModal');
            const content = document.getElementById('modalContent');
            content.innerHTML = results.length ? 
                `<div class="grid md:grid-cols-2 gap-6">` + results.map(item => `
                    <div class="border rounded-3xl p-6">
                        <div class="flex justify-between mb-4">
                            <span class="bg-blue-100 px-4 py-1 rounded-3xl text-sm">${item.day}</span>
                            <span class="bg-amber-100 px-4 py-1 rounded-3xl text-sm">${item.time}</span>
                        </div>
                        <h4 class="font-semibold">${item.course}</h4>
                        <p class="mt-4"><strong>Lecturer:</strong><br>${item.lecturer}</p>
                        <p class="mt-3"><strong>Class Rep:</strong><br>${item.classRep}</p>
                    </div>
                `).join('') + `</div>` : 
                `<p class="text-center text-gray-500 py-20">No results found</p>`;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('searchModal').classList.add('hidden');
        }

        function messageRep(name) {
            alert(`WhatsApp would open with ${name}`);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            filterByDay('all');
        }

        window.onload = loadData;
    </script>
</body>
</html>

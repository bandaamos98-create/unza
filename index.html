    async function loadData() {
        try {
            const res = await fetch('lecture.json');
            const data = await res.json();
            timetableData = data.timetable || [];
        } catch (e) {
            console.error("Failed to load lecture.json", e);
            timetableData = [];
        }
        const todayIndex = new Date().getDay();
        const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        activeDay = dayNames[todayIndex] || "Monday";
        renderDayFilters();
        renderTable(timetableData.filter(x => x.day === activeDay));
    }

    function renderDayFilters() {
        const container = document.getElementById('dayFilters');
        container.innerHTML = '';
        allDays.forEach(day => {
            const isActive = activeDay === day;
            const btnClass = isActive
                ? "px-8 py-4 bg-[#003087] text-white rounded-2xl shadow-md font-semibold"
                : "px-8 py-4 border border-gray-300 hover:border-[#003087] text-gray-700 rounded-2xl";
            container.innerHTML += `<button onclick="filterByDay('${day}')" class="${btnClass}">${day}</button>`;
        });
    }

    function renderTable(data) {
        const tbody = document.getElementById('timetableBody');
        tbody.innerHTML = data.map(item => {
            const lecturerParts = (item.lecturer || '').split('\n');
            const name = lecturerParts[0] || 'Not Assigned';
            const phone = lecturerParts[1] || '';
            return `
                <tr class="table-row border-b">
                    <td class="font-medium">${item.day || ''}</td>
                    <td>${item.time || ''}</td>
                    <td>
                        <div class="course-code">${item.course || ''}</div>
                        ${item.fullName ? `<div class="course-name">${item.fullName}</div>` : ''}
                    </td>
                    <td>
                        <div class="mb-3">${name}</div>
                        ${phone ? `<button onclick="prepareCall('${name.replace(/'/g, "\\'")}','${phone}')"
                            class="text-blue-600 flex items-center gap-2 text-lg hover:underline">
                            <i class="fas fa-phone"></i> Call Lecturer
                        </button>` : ''}
                    </td>
                </tr>`;
        }).join('');
        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-16 text-gray-500 text-3xl">No classes scheduled for this day</td></tr>`;
        }
    }

    function prepareCall(name, phone) {
        if (phone) window.location.href = `tel:${phone}`;
    }

    function liveSearch() {
        const term = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!term) {
            renderTable(timetableData.filter(x => x.day === activeDay));
            return;
        }
        const filtered = timetableData.filter(x =>
            (x.course || '').toLowerCase().includes(term) ||
            (x.fullName || '').toLowerCase().includes(term) ||
            (x.lecturer || '').toLowerCase().includes(term) ||
            (x.day || '').toLowerCase().includes(term)
        );
        renderTable(filtered);
    }

    function filterByDay(day) {
        activeDay = (activeDay === day) ? null : day;
        renderDayFilters();
        const filtered = activeDay
            ? timetableData.filter(x => x.day === activeDay)
            : timetableData;
        renderTable(filtered);
    }

        document.getElementById('programsModal').classList.add('hidden');
    }

    function renderCategories() {
        const content = document.getElementById('programsContent');
        content.innerHTML = `
            <h2 class="text-4xl font-bold text-center mb-10 text-[#003087]">Our Academic Programs</h2>
            <div class="flex justify-center">
                <button onclick="showCategory('DIPLOMA PROGRAMS')"
                        class="bg-gradient-to-r from-blue-600 to-blue-800 text-white px-16 py-8 rounded-3xl text-4xl font-semibold shadow-lg hover:scale-105 transition flex items-center gap-4">
                    <i class="fas fa-graduation-cap"></i> CLICK ME TO VIEW COURSES
                </button>
            </div>`;
    }

    function showCategory(cat) {
        const content = document.getElementById('programsContent');
        const courses = programsData[cat] || [];
        let html = `<div class="flex items-center justify-between mb-8">
            <h2 class="text-4xl font-bold text-[#003087]">${cat}</h2>
            <button onclick="renderCategories()" class="text-[#003087] hover:underline text-xl">← Back</button>
        </div><div class="space-y-6">`;
      
        courses.forEach(course => {
            html += `<button onclick="showCourseYears('${cat}', '${course}')" class="w-full flex justify-between items-center bg-gray-50 p-6 rounded-3xl border hover:border-[#003087] text-left">
                <div class="text-2xl font-medium">${course}</div>
                <i class="fas fa-chevron-right text-2xl text-gray-400"></i>
            </button>`;
        });
        html += `</div>`;
        content.innerHTML = html;
    }

    function showCourseYears(cat, course) {
        const content = document.getElementById('programsContent');
        const availableYears = Object.keys(courseStructure[course] || {}).sort();
      
        let html = `<div class="flex items-center justify-between mb-8">
            <div>
                <h2 class="text-4xl font-bold text-[#003087]">${cat}</h2>
                <h3 class="text-2xl text-gray-600">${course}</h3>
            </div>
            <button onclick="showCategory('${cat}')" class="text-[#003087] hover:underline text-xl">← Back</button>
        </div><div class="space-y-6">`;
        availableYears.forEach(year => {
            html += `<button onclick="showYearOptions('${cat}', '${course}', '${year}')" class="w-full flex justify-between items-center bg-gray-50 p-6 rounded-3xl border hover:border-[#003087] text-left">
                <div class="text-2xl font-medium">${year}</div>
                <i class="fas fa-chevron-right text-2xl text-gray-400"></i>
            </button>`;
        });
        html += `</div>`;
        content.innerHTML = html;
    }

    function showYearOptions(cat, course, year) {
        const content = document.getElementById('programsContent');
        content.innerHTML = `
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h2 class="text-4xl font-bold text-[#003087]">${cat}</h2>
                    <h3 class="text-2xl text-gray-600">${course} – ${year}</h3>
                </div>
                <button onclick="showCourseYears('${cat}', '${course}')" class="text-[#003087] hover:underline flex items-center gap-2 text-xl">← Back to Years</button>
            </div>
            <div class="grid grid-cols-2 gap-8">
                <button onclick="showCoursesList('${cat}', '${course}', '${year}')" class="bg-gradient-to-br from-emerald-600 to-teal-700 text-white p-10 rounded-3xl text-left hover:scale-105 transition shadow-lg">
                    <i class="fas fa-book text-5xl mb-4"></i>
                    <div class="text-4xl font-semibold mb-2">Courses</div>
                    <div class="text-xl opacity-90">View all courses for ${year}</div>
                </button>
                <button onclick="showYearTimetable('${cat}', '${course}', '${year}')" class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-10 rounded-3xl text-left hover:scale-105 transition shadow-lg">
                    <i class="fas fa-calendar-alt text-5xl mb-4"></i>
                    <div class="text-4xl font-semibold mb-2">Timetable</div>
                    <div class="text-xl opacity-90">View class schedule for ${year}</div>
                </button>
            </div>`;
    }

    function showCoursesList(cat, course, year) {
        const content = document.getElementById('programsContent');
        const list = courseStructure[course] && courseStructure[course][year] ? courseStructure[course][year] : [];
      
        let html = `
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h2 class="text-4xl font-bold text-[#003087]">${cat}</h2>
                    <h3 class="text-2xl text-gray-600">${course} – ${year}</h3>
                </div>
                <button onclick="showYearOptions('${cat}', '${course}', '${year}')" class="text-[#003087] hover:underline flex items-center gap-2 text-xl">← Back</button>
            </div>`;
        if (list.length === 0) {
            html += `<div class="bg-white rounded-3xl shadow-xl p-10 text-center text-3xl text-gray-500">No courses added yet.</div>`;
        } else {
            html += `<div class="bg-white rounded-3xl shadow-xl p-8">
                <div class="flex justify-between items-center mb-6">
                    <h4 class="text-3xl font-semibold">Course List</h4>
                    <span class="bg-[#003087] text-white px-6 py-2 rounded-2xl text-2xl">${list.length} Courses</span>
                </div>
                <ol class="space-y-5 text-2xl">`;
            list.forEach((c, i) => {
                html += `<li class="flex gap-4"><span class="font-bold text-[#003087]">${i+1}.</span> <strong>${c.code}</strong> - ${c.title}</li>`;
            });
            html += `</ol></div>`;
        }
        content.innerHTML = html;
    }

    // FULL TIMETABLE VIEW FOR SELECTED COURSE + YEAR (enhanced from original placeholder)
    function showYearTimetable(cat, course, year) {
        const content = document.getElementById('programsContent');
        const yearCourses = (courseStructure[course] && courseStructure[course][year]) || [];
        const courseCodes = yearCourses.map(c => c.code.toLowerCase().trim());
        // Filter main timetable data to only show classes for this program's year courses
        const filtered = timetableData.filter(item => {
            const itemCourse = (item.course || '').toLowerCase().trim();
            return courseCodes.some(code =>
                itemCourse === code ||
                itemCourse.startsWith(code) ||
                code.startsWith(itemCourse)
            );
        });
        let html = `
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h2 class="text-4xl font-bold text-[#003087]">${cat}</h2>
                    <h3 class="text-2xl text-gray-600">${course} – ${year}</h3>
                </div>
                <button onclick="showYearOptions('${cat}', '${course}', '${year}')" class="text-[#003087] hover:underline flex items-center gap-2 text-xl">← Back to Options</button>
            </div>`;
        if (filtered.length === 0) {
            html += `
                <div class="bg-white rounded-3xl shadow-xl p-10 text-center">
                    <p class="text-3xl text-gray-500 mb-8">No timetable entries have been added yet for ${course} – ${year}.</p>
                    <button onclick="openSubmitForm()" class="bg-[#003087] hover:bg-[#002266] text-white px-12 py-6 rounded-3xl text-3xl font-semibold shadow-lg flex items-center gap-3 mx-auto">
                        <i class="fas fa-plus"></i> Click to add timetable
                    </button>
                </div>`;
        } else {
            // Sort by day then time for a clean full-week view
            const sorted = [...filtered].sort((a, b) => {
                const dayOrder = allDays.indexOf(a.day || '') - allDays.indexOf(b.day || '');
                if (dayOrder !== 0) return dayOrder;
                return (a.time || '').localeCompare(b.time || '');
            });
            html += `
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-[#003087] text-white">
                            <tr>
                                <th class="text-left">Day</th>
                                <th class="text-left">Time</th>
                                <th class="text-left">Course</th>
                                <th class="text-left">Lecturer</th>
                            </tr>
                        </thead>
                        <tbody>`;
           
            html += sorted.map(item => {
                const lecturerParts = (item.lecturer || '').split('\n');
                const name = lecturerParts[0] || 'Not Assigned';
                const phone = lecturerParts[1] || '';
                return `
                    <tr class="table-row border-b">
                        <td class="font-medium">${item.day || ''}</td>
                        <td>${item.time || ''}</td>
                        <td>
                            <div class="course-code">${item.course || ''}</div>
                            ${item.fullName ? `<div class="course-name">${item.fullName}</div>` : ''}
                        </td>
                        <td>
                            <div class="mb-3">${name}</div>
                            ${phone ? `<button onclick="prepareCall('${name.replace(/'/g, "\\'")}','${phone}')" class="text-blue-600 flex items-center gap-2 text-lg hover:underline">
                                <i class="fas fa-phone"></i> Call Lecturer
                            </button>` : ''}
                        </td>
                    </tr>`;
            }).join('');
            html += `</tbody></table></div>`;
        }
        content.innerHTML = html;
    }

    // NEW: Feedback form modal functions
    function showFeedbackForm() {
        document.getElementById('feedbackModal').classList.remove('hidden');
    }

    function closeFeedbackModal() {
        document.getElementById('feedbackModal').classList.add('hidden');
    }

    // NEW: Submit Timetable modal functions
    function showSubmitTimetable() {
        document.getElementById('submitModal').classList.remove('hidden');
    }

    function closeSubmitModal() {
        document.getElementById('submitModal').classList.add('hidden');
    }

    // Updated: Now opens the real Submit Timetable Google Form
    function openSubmitForm() {
        // Optional: close programs modal so the submit form is clearly visible
        closeProgramsModal();
        showSubmitTimetable();
    }

    // Start the application
    loadData();
</script>
</body>

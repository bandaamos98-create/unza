<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>UNZA Timetable • 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Space+Grotesk:wght@700&display=swap');
        html, body { width: 1280px; min-width: 1280px; margin: 0 auto; overflow-x: auto; background: #f9fafb; }
        @media (min-width: 1280px) { html { display: flex; justify-content: center; } }
        body { font-size: 22px; line-height: 1.6; }
        .header-font { font-family: 'Space Grotesk', sans-serif; }
        th { font-size: 24px; padding: 20px; }
        td { font-size: 22px; padding: 20px; }
        input, button { font-size: 20px; }
        .table-row:hover { background-color: #f0f7ff; }
    </style>
</head>
<body>
<header class="bg-gradient-to-r from-[#003087] to-[#0048a8] text-white py-10 shadow-lg">
    <div class="px-10 flex justify-between items-center">
        <div class="flex items-center gap-6">
            <img id="logoImg" src="images/logo.png" class="w-24 h-24 bg-white p-2 rounded-2xl">
            <div>
                <h1 class="header-font text-6xl">University of Zambia</h1>
                <p class="text-blue-200 text-xl">Student Timetable Portal • 2026</p>
            </div>
        </div>
        <button onclick="showFeedbackForm()" class="bg-white text-[#003087] px-8 py-5 rounded-3xl">Help Us Improve</button>
    </div>
</header>

<main class="px-10 py-14">
    <h1 class="header-font text-7xl text-center text-[#003087]">UNZA Academic Timetable 2026</h1>
    <div class="flex justify-center mt-4">
        <button onclick="showPrograms()" class="bg-[#003087] hover:bg-[#002266] text-white px-12 py-6 rounded-3xl text-3xl font-semibold shadow-lg flex items-center gap-3">
            <i class="fas fa-graduation-cap"></i> PROGRAMS
        </button>
    </div>
    <div class="mt-14">
        <input id="searchInput" type="text" placeholder="Search course, lecturer, or day..." class="w-full px-8 py-7 rounded-3xl border" onkeyup="liveSearch()">
    </div>
    <div class="my-12 flex gap-5 flex-wrap" id="dayFilters"></div>
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
        <table class="w-full">
            <thead class="bg-[#003087] text-white">
                <tr><th>Day</th><th>Time</th><th>Course</th><th>Lecturer</th></tr>
            </thead>
            <tbody id="timetableBody"></tbody>
        </table>
    </div>
</main>

<!-- PROGRAMS MODAL -->
<div id="programsModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-4xl relative max-h-[90vh] overflow-y-auto">
        <button onclick="closeProgramsModal()" class="absolute top-5 right-6 text-4xl font-bold text-gray-500 hover:text-black">×</button>
        <div id="programsContent" class="p-10"></div>
    </div>
</div>

<!-- Other modals (unchanged) -->
<div id="callModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center">...</div>
<div id="feedbackModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">...</div>
<div id="submitFormModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">...</div>

<footer class="text-center py-12 text-gray-600 text-lg">
    <p>Created by <strong class="text-[#003087]">Amos Banda</strong></p>
    <p class="mt-2">
        <a href="tel:+260979077079" class="hover:text-blue-600">+260 979 077079</a> •
        <a href="mailto:bandaamos98@gmail.com" class="hover:text-blue-600">bandaamos98@gmail.com</a>
    </p>
</footer>

<script>
    let timetableData = [];
    let programData = {};
    let currentPhone = '';
    let activeDay = null;
    const allDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

    async function loadData() {
        // Load timetable FIRST (homepage table)
        try {
            const res = await fetch('lecture.json');
            const json = await res.json();
            timetableData = json.timetable || [];
        } catch (e) {
            console.error("Could not load lecture.json");
        }

        // Load programs for Courses section (doesn't break anything)
        try {
            const res = await fetch('program.json');
            const json = await res.json();
            programData = json.programs || {};
        } catch (e) {
            console.error("Could not load program.json");
        }

        // Render the main timetable immediately
        const todayIndex = new Date().getDay();
        const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        activeDay = dayNames[todayIndex];

        renderDayFilters();
        renderTable(timetableData.filter(x => x.day === activeDay));
    }

    // ====================== ALL YOUR ORIGINAL FUNCTIONS ======================
    function renderDayFilters() {
        const container = document.getElementById('dayFilters'); container.innerHTML = '';
        allDays.forEach(day => {
            const isActive = activeDay === day;
            const btnClass = isActive ? "px-7 py-4 bg-[#003087] text-white rounded-2xl shadow-md" : "px-7 py-4 border border-gray-300 hover:border-[#003087] text-gray-700 rounded-2xl";
            container.innerHTML += `<button onclick="filterByDay('${day}')" class="${btnClass}">${day}</button>`;
        });
    }

    function renderTable(data) {
        const tbody = document.getElementById('timetableBody');
        tbody.innerHTML = data.map(item => {
            const parts = item.lecturer.split('\n');
            const name = parts[0]; const phone = parts[1] || '';
            return `<tr class="table-row border-b"><td>${item.day}</td><td>${item.time}</td><td class="font-semibold">${item.course}</td><td><div class="mb-3">${name}</div>${phone ? `<button onclick="prepareCall('${name}','${phone}')" class="text-blue-600 flex items-center gap-2"><i class="fas fa-phone"></i> Call Lecturer</button>` : ''}</td></tr>`;
        }).join('');
    }

    function prepareCall(name, phone) { currentPhone = phone; document.getElementById('modalTitle').innerText = `Call ${name}?`; document.getElementById('modalPhone').innerText = phone; document.getElementById('callModal').classList.remove('hidden'); }
    function makeActualCall() { window.location.href = `tel:${currentPhone}`; }
    function closeCallModal() { document.getElementById('callModal').classList.add('hidden'); }
    function liveSearch() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        renderTable(timetableData.filter(x => x.course.toLowerCase().includes(term) || x.lecturer.toLowerCase().includes(term) || x.day.toLowerCase().includes(term)));
    }
    function filterByDay(day) {
        if (activeDay === day) { activeDay = null; renderDayFilters(); renderTable(timetableData); }
        else { activeDay = day; renderDayFilters(); renderTable(timetableData.filter(x => x.day === day)); }
    }
    function showFeedbackForm() { document.getElementById('feedbackModal').classList.remove('hidden'); }
    function closeFeedbackModal() { document.getElementById('feedbackModal').classList.add('hidden'); }
    function openSubmitForm() { closeProgramsModal(); document.getElementById('submitFormModal').classList.remove('hidden'); }
    function closeSubmitFormModal() { document.getElementById('submitFormModal').classList.add('hidden'); }

    // ====================== PROGRAMS NAVIGATION ======================
    function showPrograms() {
        document.getElementById('programsModal').classList.remove('hidden');
        renderCategories();
    }
    function closeProgramsModal() { document.getElementById('programsModal').classList.add('hidden'); }
    function renderCategories() { /* your original code */ 
        const content = document.getElementById('programsContent');
        content.innerHTML = `
            <h2 class="text-4xl font-bold text-center mb-10 text-[#003087]">Our Academic Programs</h2>
            <div class="grid grid-cols-2 gap-8">
                <button onclick="showCategory('CERTIFICATE (2 YEARS)')" class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-8 rounded-3xl text-left hover:scale-105 transition"><div class="text-3xl font-semibold">CERTIFICATE</div><div class="text-xl opacity-90 mt-2">2 YEARS</div></button>
                <button onclick="showCategory('DIPLOMA (3 YEARS)')" class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-8 rounded-3xl text-left hover:scale-105 transition"><div class="text-3xl font-semibold">DIPLOMA</div><div class="text-xl opacity-90 mt-2">3 YEARS</div></button>
                <button onclick="showCategory('UNDERGRADUATE (4 YEARS)')" class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-8 rounded-3xl text-left hover:scale-105 transition"><div class="text-3xl font-semibold">UNDERGRADUATE</div><div class="text-xl opacity-90 mt-2">4 YEARS</div></button>
                <button onclick="showCategory('SHORT COURSES')" class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-8 rounded-3xl text-left hover:scale-105 transition"><div class="text-3xl font-semibold">SHORT COURSES</div><div class="text-xl opacity-90 mt-2">Flexible duration</div></button>
            </div>`;
    }
    // (All other functions: showCategory, showCourseYears, showYearOptions, showCoursesList, showYearTimetable are the same as before)

    loadData();
</script>
</body>
</html>

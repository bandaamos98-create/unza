<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- HARD DESKTOP MODE -->
    <meta name="viewport" content="width=1280">
    <title>UNZA Timetable • 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Space+Grotesk:wght@700&display=swap');

        /* FORCE DESKTOP */
        html, body {
            width: 1280px;
            min-width: 1280px;
            margin: 0 auto;
            overflow-x: auto;
            background: #f9fafb;
        }

        /* CENTER BIG SCREENS */
        @media (min-width: 1280px) {
            html { display: flex; justify-content: center; }
        }

        /* ACCESSIBILITY SCALE (VERY BIG) */
        body {
            font-size: 22px;
            line-height: 1.6;
            -webkit-text-size-adjust: 100%;
        }

        .header-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* BIG TABLE */
        th {
            font-size: 24px;
            padding: 20px;
        }
        td {
            font-size: 22px;
            padding: 20px;
        }

        /* BIG INPUT */
        input { font-size: 22px; }

        /* BUTTONS BIG */
        button { font-size: 20px; }

        /* ROW HOVER */
        .table-row:hover {
            background-color: #f0f7ff;
        }
    </style>
</head>

<body>

<header class="bg-gradient-to-r from-[#003087] to-[#0048a8] text-white py-10 shadow-lg">
    <div class="px-10 flex justify-between items-center">
        <div class="flex items-center gap-6">
            <img id="logoImg" src="images/logo.png" class="w-24 h-24 bg-white p-2 rounded-2xl">
            <div>
                <h1 class="header-font text-6xl">University of Zambia</h1>
                <p class="text-blue-200 text-xl">Student Timetable Portal • 2026</p>
            </div>
        </div>

        <button onclick="showFeedbackForm()" 
                class="bg-white text-[#003087] px-8 py-5 rounded-3xl">
            Help Us Improve
        </button>
    </div>
</header>

<main class="px-10 py-14">

    <h1 class="header-font text-7xl text-center text-[#003087]">
        UNZA Academic Timetable 2026
    </h1>

    <p class="text-center text-gray-600 text-xl mt-4">
        The University of Zambia
    </p>

    <!-- SEARCH -->
    <div class="mt-14">
        <input id="searchInput" type="text"
               placeholder="Search course, lecturer, or day..."
               class="w-full px-8 py-7 rounded-3xl border"
               onkeyup="liveSearch()">
    </div>

    <!-- FILTERS (7 days only – no ALL button) -->
    <div class="my-12 flex gap-5 flex-wrap" id="dayFilters"></div>

    <!-- TABLE -->
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
        <table class="w-full">
            <thead class="bg-[#003087] text-white">
                <tr>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Course</th>
                    <th>Lecturer</th>
                </tr>
            </thead>
            <tbody id="timetableBody"></tbody>
        </table>
    </div>

</main>

<!-- CALL MODAL -->
<div id="callModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center">
    <div class="bg-white rounded-3xl p-10 w-[450px] text-center">
        <h3 id="modalTitle" class="text-3xl font-semibold mb-6"></h3>
        <p id="modalPhone" class="text-2xl text-blue-600 mb-8"></p>
        <div class="flex gap-5">
            <button onclick="closeCallModal()" class="flex-1 py-5 bg-gray-200 rounded-2xl">Cancel</button>
            <button onclick="makeActualCall()" class="flex-1 py-5 bg-blue-600 text-white rounded-2xl">Call Now</button>
        </div>
    </div>
</div>

<!-- FEEDBACK MODAL -->
<div id="feedbackModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-4xl relative">
        <button onclick="closeFeedbackModal()" 
                class="absolute top-5 right-6 text-4xl font-bold text-gray-500 hover:text-black">×</button>
        <iframe 
            src="https://docs.google.com/forms/d/e/1FAIpQLSfvxXjelmBCdbdXixV1cGSpVfdhcqbtdeeLFSxshzDX31hlxQ/viewform?embedded=true"
            width="100%" height="700"></iframe>
    </div>
</div>

<!-- FOOTER -->
<footer class="text-center py-12 text-gray-600 text-lg">
    <p>Created by <strong class="text-[#003087]">Amos Banda</strong></p>
    <p class="mt-2">
        <a href="tel:+260979077079" class="hover:text-blue-600">+260 979 077079</a>
        • 
        <a href="mailto:bandaamos98@gmail.com" class="hover:text-blue-600">bandaamos98@gmail.com</a>
    </p>
</footer>

<script>
    let timetableData = [];
    let currentPhone = '';
    let activeDay = null;

    const allDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

    async function loadData() {
        const res = await fetch('lecture.json');
        const data = await res.json();

        timetableData = data.timetable || [];

        // === AUTO-SELECT TODAY'S DAY ON PAGE LOAD ===
        const todayIndex = new Date().getDay();           // 0 = Sunday, 1 = Monday, ..., 6 = Saturday
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        activeDay = dayNames[todayIndex];

        renderDayFilters();
        
        // Show only today's courses
        const todayData = timetableData.filter(x => x.day === activeDay);
        renderTable(todayData);
    }

    function renderDayFilters() {
        const container = document.getElementById('dayFilters');
        container.innerHTML = '';

        allDays.forEach(day => {
            const isActive = activeDay === day;
            const btnClass = isActive
                ? "px-7 py-4 bg-[#003087] text-white rounded-2xl shadow-md"   // selected = blue + white text
                : "px-7 py-4 border border-gray-300 hover:border-[#003087] text-gray-700 rounded-2xl";

            container.innerHTML += `
                <button onclick="filterByDay('${day}')" 
                        class="${btnClass}">${day}</button>`;
        });
    }

    function renderTable(data = timetableData) {
        const tbody = document.getElementById('timetableBody');

        tbody.innerHTML = data.map(item => {
            const parts = item.lecturer.split('\n');
            const name = parts[0];
            const phone = parts[1] || '';

            return `
                <tr class="table-row border-b">
                    <td>${item.day}</td>
                    <td>${item.time}</td>
                    <td class="font-semibold">${item.course}</td>
                    <td>
                        <div class="mb-3">${name}</div>
                        ${phone ? `
                        <button onclick="prepareCall('${name}','${phone}')" 
                                class="text-blue-600 flex items-center gap-2">
                            <i class="fas fa-phone"></i> Call Lecturer
                        </button>` : ''}
                    </td>
                </tr>`;
        }).join('');
    }

    function prepareCall(name, phone) {
        currentPhone = phone;
        document.getElementById('modalTitle').innerText = `Call ${name}?`;
        document.getElementById('modalPhone').innerText = phone;
        document.getElementById('callModal').classList.remove('hidden');
    }

    function makeActualCall() {
        window.location.href = `tel:${currentPhone}`;
    }

    function closeCallModal() {
        document.getElementById('callModal').classList.add('hidden');
    }

    function liveSearch() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        renderTable(
            timetableData.filter(x =>
                x.course.toLowerCase().includes(term) ||
                x.lecturer.toLowerCase().includes(term) ||
                x.day.toLowerCase().includes(term)
            )
        );
    }

    function filterByDay(day) {
        // Clicking the already-selected day shows ALL again
        if (activeDay === day) {
            activeDay = null;
            renderDayFilters();
            renderTable();
        } else {
            activeDay = day;
            renderDayFilters();
            const filtered = timetableData.filter(x => x.day === day);
            renderTable(filtered);
        }
    }

    function showFeedbackForm() {
        document.getElementById('feedbackModal').classList.remove('hidden');
    }

    function closeFeedbackModal() {
        document.getElementById('feedbackModal').classList.add('hidden');
    }

    // START THE APP
    loadData();
</script>

</body>
</html>

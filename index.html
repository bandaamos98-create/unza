        }

        }
        
        input, textarea {

            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }
        
        html, body {
            width: 100%;
            min-width: 320px;
            max-width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        
        body {
            font-size: 16px;
            line-height: 1.5;
            color: #1e293b;
        }
        
        .header-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .mobile-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 16px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .card:active {
            transform: scale(0.98);
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            text-decoration: none;
            min-height: 52px;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #003087 0%, #0048a8 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #003087;
            border: 2px solid #e2e8f0;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 16px 48px 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #003087;
            box-shadow: 0 0 0 3px rgba(0, 48, 135, 0.1);
        }
        
        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        
        .day-filter {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            white-space: nowrap;
        }
        
        .day-filter.active {
            background: #003087;
            color: white;
        }
        
        .day-filter:not(.active) {
            background: #f1f5f9;
            color: #64748b;
            border-color: #e2e8f0;
        }
        
        .class-card {
            margin-bottom: 16px;
            padding: 20px;
            border-left: 4px solid #003087;
        }
        
        .class-time {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .course-code {
            font-size: 18px;
            font-weight: 700;
            color: #003087;

        .course-name {

            color: #10b981;
            margin-bottom: 12px;
            line-height: 1.4;
            font-weight: 600;
        }
        
        .lecturer-name {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }

            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

            transform: scale(0.95);
            background: #059669;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }
        
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            color: #64748b;
            cursor: pointer;
            padding: 8px;
            min-width: 44px;
            min-height: 44px;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        
        .modal-close:hover {
            background: rgba(0, 0, 0, 0.1);
            color: #1e293b;
        }
        
        .modal-close:active {
            background: rgba(0, 0, 0, 0.2);
            transform: scale(0.95);
        }
        
        .floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #003087 0%, #0048a8 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(0, 48, 135, 0.3);
            z-index: 999;

            max-height: 60vh;
            overflow-y: auto;
        }

            padding: 16px 20px;

        }

        }

        async function loadData() {
            try {
                const res = await fetch('lecture.json');
                const data = await res.json();
                timetableData = data.timetable || [];
            } catch (e) {
                console.error("Failed to load lecture.json", e);
                timetableData = [];
            }
            
            // Set today as active day
            const todayIndex = new Date().getDay();
            const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
            activeDay = dayNames[todayIndex] || "Monday";
            
            renderDayFilters();
            renderClasses();
        }

        function renderDayFilters() {
            const container = document.getElementById('dayFilters');
            container.innerHTML = '';
            
            // Add "All" button
            const allBtn = document.createElement('button');
            allBtn.className = `day-filter ${!activeDay ? 'active' : ''}`;
            allBtn.textContent = 'All';
            allBtn.onclick = () => filterByDay(null);
            container.appendChild(allBtn);
            
            // Add day buttons
            allDays.forEach(day => {
                const btn = document.createElement('button');
                btn.className = `day-filter ${activeDay === day ? 'active' : ''}`;
                btn.textContent = day.substring(0, 3); // Show first 3 letters on mobile
                btn.onclick = () => filterByDay(day);
                container.appendChild(btn);
            });
        }

        function renderClasses() {
            const container = document.getElementById('classesList');
            const filtered = activeDay 
                ? timetableData.filter(item => item.day === activeDay)
                : timetableData;
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="card empty-state">
                        <i class="fas fa-calendar-times"></i>
                        <h3 class="text-lg font-semibold mb-2">No Classes Found</h3>
                        <p>No classes scheduled for ${activeDay || 'this filter'}</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filtered.map(item => {
                const lecturerParts = (item.lecturer || '').split('\n');
                const name = lecturerParts[0] || 'Not Assigned';
                const phone = lecturerParts[1] || '';
                
                return `
                    <div class="card class-card">
                        <div class="class-time">
                            <i class="fas fa-clock mr-2"></i>${item.day || ''} • ${item.time || ''}
                        </div>
                        <div class="course-code">${item.course || ''}</div>
                        ${item.fullName ? `<div class="course-name">${item.fullName}</div>` : ''}
                        <div class="lecturer-name">${name}</div>
                        ${phone ? `
                            <a href="tel:${phone}" class="call-btn">
                                <i class="fas fa-phone"></i>
                                Call Lecturer
                            </a>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function liveSearch() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!term) {
                renderClasses();
                return;
            }
            
            const filtered = timetableData.filter(item => 
                (item.course || '').toLowerCase().includes(term) ||
                (item.fullName || '').toLowerCase().includes(term) ||
                (item.lecturer || '').toLowerCase().includes(term) ||
                (item.day || '').toLowerCase().includes(term)
            );
            
            renderFilteredClasses(filtered);
        }

        function renderFilteredClasses(filtered) {
            const container = document.getElementById('classesList');
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="card empty-state">
                        <i class="fas fa-search"></i>
                        <h3 class="text-lg font-semibold mb-2">No Results Found</h3>
                        <p>Try searching with different keywords</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filtered.map(item => {
                const lecturerParts = (item.lecturer || '').split('\n');
                const name = lecturerParts[0] || 'Not Assigned';
                const phone = lecturerParts[1] || '';
                
                return `
                    <div class="card class-card">
                        <div class="class-time">
                            <i class="fas fa-clock mr-2"></i>${item.day || ''} • ${item.time || ''}
                        </div>
                        <div class="course-code">${item.course || ''}</div>
                        ${item.fullName ? `<div class="course-name">${item.fullName}</div>` : ''}
                        <div class="lecturer-name">${name}</div>
                        ${phone ? `
                            <a href="tel:${phone}" class="call-btn">
                                <i class="fas fa-phone"></i>
                                Call Lecturer
                            </a>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function filterByDay(day) {
            activeDay = (activeDay === day) ? null : day;
            renderDayFilters();
            renderClasses();
        }

        function showPrograms() {
            document.getElementById('programsModal').classList.remove('hidden');
            showProgramList('DIPLOMA PROGRAMS');
        }

        function showProgramList(category) {
            const content = document.getElementById('programsContent');
            const programs = programsData[category] || [];
            
            content.innerHTML = `
                <div class="flex items-center mb-4">
                    <button onclick="closeProgramsModal()" class="text-[#003087] mr-3">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h3 class="header-font text-xl font-bold text-[#003087]">${category}</h3>
                </div>
                <div class="program-list">
                    ${programs.map(program => `
                        <div class="program-item" onclick="showProgramYears('${program}')">
                            <div class="font-medium">${program}</div>
                            <i class="fas fa-chevron-right text-gray-400"></i>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function showProgramYears(program) {
            const content = document.getElementById('programsContent');
            const availableYears = Object.keys(courseStructure[program] || {}).sort();
            
            content.innerHTML = `
                <div class="flex items-center mb-4">
                    <button onclick="showProgramList('DIPLOMA PROGRAMS')" class="text-[#003087] mr-3">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div>
                        <h3 class="header-font text-lg font-bold text-[#003087]">${program}</h3>
                        <p class="text-sm text-gray-500">Select year level</p>
                    </div>
                </div>
                <div class="program-list">
                    ${availableYears.map(year => `
                        <div class="program-item" onclick="showYearOptions('${program}', '${year}')">
                            <div class="font-medium">${year}</div>
                            <i class="fas fa-chevron-right text-gray-400"></i>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function showYearOptions(program, year) {
            const content = document.getElementById('programsContent');
            
            content.innerHTML = `
                <div class="flex items-center mb-4">
                    <button onclick="showProgramYears('${program}')" class="text-[#003087] mr-3">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div>
                        <h3 class="header-font text-lg font-bold text-[#003087]">${program}</h3>
                        <p class="text-sm text-gray-500">${year}</p>
                    </div>
                </div>
                <div class="space-y-3">
                    <button onclick="showCoursesList('${program}', '${year}')" class="w-full btn btn-primary">
                        <i class="fas fa-book"></i>
                        <span>View Courses</span>
                    </button>
                    <button onclick="showYearTimetable('${program}', '${year}')" class="w-full btn btn-primary">
                        <i class="fas fa-calendar-alt"></i>
                        <span>View Timetable</span>
                    </button>
                </div>
            `;
        }

        function showCoursesList(program, year) {
            const content = document.getElementById('programsContent');
            const courses = courseStructure[program] && courseStructure[program][year] ? courseStructure[program][year] : [];
            
            content.innerHTML = `
                <div class="flex items-center mb-4">
                    <button onclick="showYearOptions('${program}', '${year}')" class="text-[#003087] mr-3">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div>
                        <h3 class="header-font text-lg font-bold text-[#003087]">${program}</h3>
                        <p class="text-sm text-gray-500">${year} - Courses</p>
                    </div>
                </div>
                <div class="bg-gray-50 rounded-lg p-3 mb-3">
                    <div class="text-sm font-medium text-gray-700">${courses.length} Courses</div>
                </div>
                <div class="program-list">
                    ${courses.map((course, index) => `
                        <div class="program-item">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="font-medium text-sm">${course.code}</div>
                                    <div class="text-xs text-gray-600 mt-1">${course.title}</div>
                                </div>
                                <div class="text-xs text-gray-400 ml-3">#${index + 1}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function showYearTimetable(program, year) {
            const content = document.getElementById('programsContent');
            const yearCourses = (courseStructure[program] && courseStructure[program][year]) || [];
            const courseCodes = yearCourses.map(c => c.code.toLowerCase().trim());
            
            // Filter main timetable data to only show classes for this program's year courses
            const filtered = timetableData.filter(item => {
                const itemCourse = (item.course || '').toLowerCase().trim();
                return courseCodes.some(code =>
                    itemCourse === code ||
                    itemCourse.startsWith(code) ||
                    code.startsWith(itemCourse)
                );
            });
            
            content.innerHTML = `
                <div class="flex items-center mb-4">
                    <button onclick="showYearOptions('${program}', '${year}')" class="text-[#003087] mr-3">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div>
                        <h3 class="header-font text-lg font-bold text-[#003087]">${program}</h3>
                        <p class="text-sm text-gray-500">${year} - Timetable</p>
                    </div>
                </div>
            `;
            
            if (filtered.length === 0) {
                content.innerHTML += `
                    <div class="text-center py-8">
                        <i class="fas fa-calendar-times text-3xl text-gray-300 mb-3"></i>
                        <p class="text-gray-500">No timetable entries found</p>
                        <button onclick="showSubmitTimetable()" class="btn btn-primary mt-3">
                            <i class="fas fa-plus"></i>
                            <span>Add Timetable</span>
                        </button>
                    </div>
                `;
            } else {
                // Add day selection buttons
                const weekdays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
                content.innerHTML += `
                    <div class="flex gap-2 mb-4 overflow-x-auto pb-2">
                        ${weekdays.map(day => `
                            <button onclick="showProgramTimetableByDay('${program}', '${year}', '${day}')" 
                                    class="day-filter" id="day-${day}">
                                ${day.substring(0, 3)}
                            </button>
                        `).join('')}
                    </div>
                    <div id="programTimetableContent">
                        <!-- Timetable content will be inserted here -->
                    </div>
                `;
                
                // Show Monday by default
                showProgramTimetableByDay(program, year, 'Monday');
            }
        }

        function showProgramTimetableByDay(program, year, selectedDay) {
            const yearCourses = (courseStructure[program] && courseStructure[program][year]) || [];
            const courseCodes = yearCourses.map(c => c.code.toLowerCase().trim());
            
            // Filter main timetable data to only show classes for this program's year courses
            const filtered = timetableData.filter(item => {
                const itemCourse = (item.course || '').toLowerCase().trim();
                return courseCodes.some(code =>
                    itemCourse === code ||
                    itemCourse.startsWith(code) ||
                    code.startsWith(itemCourse)
                ) && (item.day || '') === selectedDay;
            });
            
            // Update active day button
            document.querySelectorAll('.day-filter').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeBtn = document.getElementById(`day-${selectedDay}`);
            if (activeBtn) activeBtn.classList.add('active');
            
            const contentDiv = document.getElementById('programTimetableContent');
            
            if (filtered.length === 0) {
                contentDiv.innerHTML = `
                    <div class="text-center py-8">
                        <i class="fas fa-calendar-times text-2xl text-gray-300 mb-3"></i>
                        <p class="text-gray-500">No classes on ${selectedDay}</p>
                    </div>
                `;
            } else {
                // Sort by time
                const sorted = [...filtered].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
                
                contentDiv.innerHTML = `
                    <div class="bg-gray-50 rounded-lg p-3 mb-3">
                        <div class="text-sm font-medium text-gray-700">${sorted.length} Classes on ${selectedDay}</div>
                    </div>
                    <div class="program-list">
                        ${sorted.map(item => {
                            const lecturerParts = (item.lecturer || '').split('\n');
                            const name = lecturerParts[0] || 'Not Assigned';
                            const phone = lecturerParts[1] || '';
                            
                            return `
                                <div class="program-item">
                                    <div class="space-y-2">
                                        <div class="flex justify-between items-start">
                                            <div class="flex-1">
                                                <div class="font-medium text-sm">${item.course || ''}</div>
                                                <div class="text-xs text-gray-600">${item.fullName || ''}</div>
                                                <div class="text-xs text-gray-500 mt-1">
                                                    <i class="fas fa-clock mr-1"></i>${item.time || ''}
                                                </div>
                                            </div>
                                        </div>
                                        <div class="flex justify-between items-center">
                                            <div class="text-sm">${name}</div>
                                            ${phone ? `
                                                <a href="tel:${phone}" class="call-btn text-xs">
                                                    <i class="fas fa-phone"></i>
                                                    Call
                                                </a>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }
        }

        function showSubmitTimetable() {
            document.getElementById('submitModal').classList.remove('hidden');
        }

        function closeSubmitModal() {
            document.getElementById('submitModal').classList.add('hidden');
        }

        function closeProgramsModal() {
            document.getElementById('programsModal').classList.add('hidden');
        }

        function showFeedbackForm() {
            document.getElementById('feedbackModal').classList.remove('hidden');
        }

        function closeFeedbackModal() {
            document.getElementById('feedbackModal').classList.add('hidden');
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Close modals when clicking outside
        document.addEventListener('click', function(event) {
            if (event.target.classList.contains('modal')) {
                closeProgramsModal();
                closeSubmitModal();
                closeFeedbackModal();
            }
        });

        // Initialize app
        loadData();
    </script>

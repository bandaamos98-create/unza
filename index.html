<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- ✅ FIXED VIEWPORT -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>UNZA Timetable • 2026</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Space+Grotesk:wght@700&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            background: #f9fafb;
            font-size: 18px;
        }

        /* MAIN CONTAINER (DESKTOP FEEL BUT RESPONSIVE) */
        .main-container {
            max-width: 1280px;
            margin: auto;
            padding: 10px;
        }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 768px) {
            body {
                font-size: 20px;
            }

            h1 {
                font-size: 32px !important;
            }

            th {
                font-size: 18px;
                padding: 12px;
            }

            td {
                font-size: 16px;
                padding: 12px;
            }

            input, button {
                font-size: 16px !important;
                padding: 12px !important;
            }

            img {
                width: 60px !important;
                height: 60px !important;
            }
        }

        .header-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .table-row:hover {
            background-color: #f0f7ff;
        }
    </style>
</head>

<body>
<div class="main-container">

<header class="bg-gradient-to-r from-[#003087] to-[#0048a8] text-white py-6 shadow-lg">
    <div class="px-4 flex justify-between items-center flex-wrap gap-4">
        <div class="flex items-center gap-4">
            <img src="images/logo.png" class="w-20 h-20 bg-white p-2 rounded-2xl">
            <div>
                <h1 class="header-font text-3xl md:text-5xl">University of Zambia</h1>
                <p class="text-blue-200">Student Timetable Portal • 2026</p>
            </div>
        </div>

        <button onclick="showFeedbackForm()" class="bg-white text-[#003087] px-5 py-3 rounded-xl">
            Help Us Improve
        </button>
    </div>
</header>

<main class="px-4 py-10">

    <h1 class="header-font text-3xl md:text-6xl text-center text-[#003087]">
        UNZA Academic Timetable 2026
    </h1>

    <div class="flex justify-center mt-6">
        <button onclick="showPrograms()" class="bg-[#003087] text-white px-6 py-4 rounded-2xl text-xl shadow-lg flex items-center gap-2">
            <i class="fas fa-graduation-cap"></i> PROGRAMS
        </button>
    </div>

    <div class="mt-10">
        <input id="searchInput" type="text"
            placeholder="Search course, lecturer, or day..."
            class="w-full px-5 py-4 rounded-2xl border"
            onkeyup="liveSearch()">
    </div>

    <div class="my-8 flex gap-3 flex-wrap" id="dayFilters"></div>

    <div class="bg-white rounded-2xl shadow overflow-x-auto">
        <table class="w-full">
            <thead class="bg-[#003087] text-white">
                <tr>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Course</th>
                    <th>Lecturer</th>
                </tr>
            </thead>
            <tbody id="timetableBody"></tbody>
        </table>
    </div>

</main>

<footer class="text-center py-10 text-gray-600">
    <p>Created by <strong class="text-[#003087]">Amos Banda</strong></p>
</footer>

</div>

<script>
let timetableData = [];
let activeDay = null;

const allDays = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

async function loadData() {
    const res = await fetch('lecture.json');
    const data = await res.json();
    timetableData = data.timetable || [];

    const todayIndex = new Date().getDay();
    const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    activeDay = dayNames[todayIndex];

    renderDayFilters();
    renderTable(timetableData.filter(x => x.day === activeDay));
}

function renderDayFilters() {
    const container = document.getElementById('dayFilters');
    container.innerHTML = '';

    allDays.forEach(day => {
        const active = activeDay === day;

        container.innerHTML += `
        <button onclick="filterByDay('${day}')"
        class="px-4 py-2 rounded-xl ${active ? 'bg-[#003087] text-white' : 'border'}">
        ${day}
        </button>`;
    });
}

function renderTable(data) {
    const tbody = document.getElementById('timetableBody');

    tbody.innerHTML = data.map(item => {
        const parts = item.lecturer.split('\\n');
        const name = parts[0];
        const phone = parts[1] || '';

        return `
        <tr class="table-row border-b">
            <td>${item.day}</td>
            <td>${item.time}</td>
            <td class="font-semibold">${item.course}</td>
            <td>
                ${name}<br>
                ${phone ? `<a href="tel:${phone}" class="text-blue-600">Call</a>` : ''}
            </td>
        </tr>`;
    }).join('');
}

function liveSearch() {
    const term = document.getElementById('searchInput').value.toLowerCase();

    renderTable(
        timetableData.filter(x =>
            x.course.toLowerCase().includes(term) ||
            x.lecturer.toLowerCase().includes(term) ||
            x.day.toLowerCase().includes(term)
        )
    );
}

function filterByDay(day) {
    if (activeDay === day) {
        activeDay = null;
        renderTable(timetableData);
    } else {
        activeDay = day;
        renderTable(timetableData.filter(x => x.day === day));
    }
    renderDayFilters();
}

loadData();
</script>

</body>
</html>

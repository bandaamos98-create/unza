<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Forces desktop mode + fits screen perfectly -->
    <meta name="viewport" content="width=1280, initial-scale=0.75, maximum-scale=1.0, user-scalable=no">
    
    <title>UNZA Timetable • 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        .header-font { font-family: 'Space Grotesk', sans-serif; }
       
        .day-filter {
            transition: all 0.3s ease;
        }
        .day-filter.active {
            background-color: #003087 !important;
            color: white !important;
        }
       
        .table-row:hover {
            background-color: #f0f7ff;
        }
       
        .scrollable-filters {
            scrollbar-width: none;
        }
        .scrollable-filters::-webkit-scrollbar {
            display: none;
        }
        
        table {
            min-width: 900px;
        }
    </style>
</head>
<body class="bg-gray-50">
    <header class="bg-gradient-to-r from-[#003087] to-[#0048a8] text-white py-6 shadow-lg">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between" id="logoContainer">
            <!-- Logo and Title -->
            <div class="flex items-center gap-4">
                <img id="logoImg" src="images/logo.png" alt="UNZA" class="w-16 h-16 object-contain bg-white rounded-2xl p-2 shadow-inner">
                <div>
                    <h1 class="header-font text-4xl tracking-tighter">University of Zambia</h1>
                    <p class="text-blue-200">Student Timetable Portal • 2026</p>
                </div>
            </div>
            
            <!-- Help Button -->
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfvxXjelmBCdbdXixV1cGSpVfdhcqbtdeeLFSxshzDX31hlxQ/viewform" 
               target="_blank"
               class="bg-white text-[#003087] px-6 py-3 rounded-3xl font-medium hover:bg-blue-50 transition flex items-center gap-2">
                <i class="fas fa-comment-dots"></i>
                Help Us Improve
            </a>
        </div>
    </header>
    
    <main class="max-w-7xl mx-auto px-6 py-10">
        <h1 class="header-font text-5xl font-bold text-[#003087] text-center">UNZA Academic Timetable 2026</h1>
        <p class="text-center text-gray-600 mt-2">The University of Zambia</p>

        <!-- Live Search -->
        <div class="mt-10">
            <input id="searchInput" type="text" placeholder="Search course, lecturer, or day..."
                   class="w-full px-6 py-5 rounded-3xl border border-gray-300 focus:border-[#003087] text-lg outline-none"
                   onkeyup="liveSearch()">
        </div>

        <!-- Day Filters -->
        <div class="my-8 overflow-x-auto scrollable-filters pb-2">
            <div class="flex gap-3 whitespace-nowrap" id="dayFilters"></div>
        </div>

        <!-- Timetable -->
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
            <table class="w-full">
                <thead class="bg-[#003087] text-white sticky top-0">
                    <tr>
                        <th class="px-6 py-6 text-left">Day</th>
                        <th class="px-6 py-6 text-left">Time</th>
                        <th class="px-6 py-6 text-left">Course</th>
                        <th class="px-6 py-6 text-left">Lecturer</th>
                        <th class="px-6 py-6 text-center w-32">Action</th>
                    </tr>
                </thead>
                <tbody id="timetableBody" class="divide-y"></tbody>
            </table>
        </div>
    </main>

    <!-- Confirmation Modal -->
    <div id="callModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl w-full max-w-sm mx-4 overflow-hidden">
            <div class="p-6 text-center border-b">
                <h3 class="text-xl font-semibold" id="modalTitle">Confirm Call</h3>
            </div>
            <div class="p-6 space-y-4" id="callOptions"></div>
            <div class="p-4 flex gap-3">
                <button onclick="closeCallModal()" 
                        class="flex-1 py-4 text-gray-600 font-medium rounded-3xl hover:bg-gray-100">
                    Cancel
                </button>
                <button onclick="confirmAndCall()" 
                        id="callNowBtn"
                        class="flex-1 py-4 bg-blue-600 text-white font-medium rounded-3xl hover:bg-blue-700">
                    Call Now
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-10 text-gray-500 text-sm">
        <p>Created by <span class="font-medium text-[#003087]">Amos Banda</span></p>
        <p class="mt-1">
            <a href="tel:+260979077079" class="hover:text-blue-600">+260 979 077079</a> • 
            <a href="mailto:bandaamos98@gmail.com" class="hover:text-blue-600">bandaamos98@gmail.com</a>
        </p>
    </footer>

    <script>
        let timetableData = [];
        let currentPhone = '';
        let currentName = '';

        async function loadData() {
            try {
                const res = await fetch('lecture.json');
                const data = await res.json();
               
                timetableData = data.timetable || [];
                const logoPath = data.logo || 'images/logo.png';

                document.getElementById('logoImg').src = logoPath;

                renderDayFilters();
                renderTable();
            } catch (e) {
                console.error(e);
                alert("Could not load lecture.json");
            }
        }

        const allDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

        function renderDayFilters() {
            const container = document.getElementById('dayFilters');
            container.innerHTML = `
                <div onclick="filterByDay('all')" id="filter-all"
                     class="day-filter active px-7 py-3 bg-[#003087] text-white rounded-3xl cursor-pointer font-medium">ALL COURSES</div>
            `;

            allDays.forEach(day => {
                const div = document.createElement('div');
                div.textContent = day;
                div.id = `filter-${day}`;
                div.className = "day-filter px-7 py-3 bg-white border border-gray-300 hover:border-[#003087] rounded-3xl cursor-pointer font-medium";
                div.onclick = () => filterByDay(day);
                container.appendChild(div);
            });
        }

        function renderTable(filteredData = null) {
            const dataToRender = filteredData || timetableData;
            const tbody = document.getElementById('timetableBody');
            
            tbody.innerHTML = dataToRender.map((item, index) => {
                const lecturerName = item.lecturer.split('\n')[0] || item.lecturer;
                return `
                    <tr class="table-row border-b" data-index="${index}">
                        <td class="px-6 py-6 font-medium">${item.day}</td>
                        <td class="px-6 py-6">${item.time}</td>
                        <td class="px-6 py-6 font-medium">${item.course}</td>
                        <td class="px-6 py-6">
                            <div class="font-medium">${lecturerName}</div>
                        </td>
                        <td class="px-6 py-6 text-center">
                            <button class="call-btn bg-blue-600 hover:bg-blue-700 text-white px-7 py-3 rounded-3xl text-sm font-medium flex items-center gap-2 mx-auto">
                                <i class="fas fa-phone"></i>
                                Call
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            document.querySelectorAll('.call-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const row = this.closest('tr');
                    const index = parseInt(row.getAttribute('data-index'));
                    const item = dataToRender[index];
                    if (item) prepareCall(item.lecturer);
                });
            });
        }

        function prepareCall(lecturerStr) {
            const lecturerName = lecturerStr.split('\n')[0] || 'Lecturer';
            currentPhone = lecturerStr.split('\n')[1] || 'N/A';
            currentName = lecturerName;

            if (currentPhone === 'N/A' || !currentPhone) {
                alert("No phone number available for this lecturer.");
                return;
            }

            // Show confirmation modal
            document.getElementById('modalTitle').textContent = `Call ${lecturerName}?`;
            document.getElementById('callOptions').innerHTML = `
                <p class="text-center text-gray-600 py-4">
                    Do you want to call <strong>${lecturerName}</strong>?<br>
                    <span class="text-blue-600 font-medium">${currentPhone}</span>
                </p>
            `;
            document.getElementById('callModal').classList.remove('hidden');
        }

        function confirmAndCall() {
            if (currentPhone && currentPhone !== 'N/A') {
                window.location.href = `tel:${currentPhone}`;
                closeCallModal();
            }
        }

        function closeCallModal() {
            document.getElementById('callModal').classList.add('hidden');
            currentPhone = '';
            currentName = '';
        }

        function filterByDay(day) {
            document.querySelectorAll('.day-filter').forEach(el => el.classList.remove('active'));
           
            if (day === 'all') {
                document.getElementById('filter-all').classList.add('active');
                renderTable();
            } else {
                document.getElementById(`filter-${day}`).classList.add('active');
                const filtered = timetableData.filter(item => item.day === day);
                renderTable(filtered);
            }
        }

        function liveSearch() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!term) {
                renderTable();
                return;
            }
           
            const filtered = timetableData.filter(item =>
                item.course.toLowerCase().includes(term) ||
                item.lecturer.toLowerCase().includes(term) ||
                item.day.toLowerCase().includes(term)
            );
            renderTable(filtered);
        }

        window.onload = loadData;
    </script>
</body>
</html>

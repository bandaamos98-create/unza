<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- 🔥 FORCE DESKTOP WIDTH + CONTROL SCALE -->
    <meta name="viewport" content="width=1280, initial-scale=0.9, maximum-scale=1, user-scalable=no">

    <title>UNZA Timetable • 2026</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Space+Grotesk:wght@700&display=swap');

        /* 🔥 TRUE DESKTOP LOCK */
        html, body {
            width: 1280px;
            min-width: 1280px;
            margin: 0 auto;
            background: #f9fafb;
            overflow-x: hidden;
        }

        /* 🔥 CENTER ON BIG SCREENS */
        @media (min-width: 1280px) {
            html {
                display: flex;
                justify-content: center;
            }
        }

        /* 🔥 MAKE EVERYTHING BIGGER */
        body {
            font-size: 24px;
            line-height: 1.7;
        }

        th {
            font-size: 26px;
            padding: 22px;
        }

        td {
            font-size: 24px;
            padding: 22px;
        }

        input, button {
            font-size: 22px;
            padding: 18px;
        }

        h1 {
            font-size: 60px !important;
        }

        .header-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .table-row:hover {
            background-color: #f0f7ff;
        }
    </style>
</head>

<body>

<header class="bg-gradient-to-r from-[#003087] to-[#0048a8] text-white py-10 shadow-lg">
    <div class="px-10 flex justify-between items-center">
        <div class="flex items-center gap-6">
            <img src="images/logo.png" class="w-28 h-28 bg-white p-2 rounded-2xl">
            <div>
                <h1 class="header-font">University of Zambia</h1>
                <p class="text-blue-200 text-2xl">Student Timetable Portal • 2026</p>
            </div>
        </div>

        <button onclick="showFeedbackForm()" class="bg-white text-[#003087] px-10 py-5 rounded-3xl">
            Help Us Improve
        </button>
    </div>
</header>

<main class="px-10 py-14">

    <h1 class="header-font text-center text-[#003087]">
        UNZA Academic Timetable 2026
    </h1>

    <div class="flex justify-center mt-6">
        <button onclick="showPrograms()" class="bg-[#003087] text-white px-14 py-6 rounded-3xl text-3xl shadow-lg flex items-center gap-3">
            <i class="fas fa-graduation-cap"></i> PROGRAMS
        </button>
    </div>

    <div class="mt-12">
        <input id="searchInput" type="text"
            placeholder="Search course, lecturer, or day..."
            class="w-full px-8 py-6 rounded-3xl border"
            onkeyup="liveSearch()">
    </div>

    <div class="my-12 flex gap-5 flex-wrap" id="dayFilters"></div>

    <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
        <table class="w-full">
            <thead class="bg-[#003087] text-white">
                <tr>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Course</th>
                    <th>Lecturer</th>
                </tr>
            </thead>
            <tbody id="timetableBody"></tbody>
        </table>
    </div>

</main>

<footer class="text-center py-12 text-gray-600 text-lg">
    <p>Created by <strong class="text-[#003087]">Amos Banda</strong></p>
</footer>

<script>
let timetableData = [];
let currentPhone = '';
let activeDay = null;

const allDays = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

async function loadData() {
    const res = await fetch('lecture.json');
    const data = await res.json();
    timetableData = data.timetable || [];

    const todayIndex = new Date().getDay();
    const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    activeDay = dayNames[todayIndex];

    renderDayFilters();
    renderTable(timetableData.filter(x => x.day === activeDay));
}

function renderDayFilters() {
    const container = document.getElementById('dayFilters');
    container.innerHTML = '';

    allDays.forEach(day => {
        const active = activeDay === day;

        container.innerHTML += `
        <button onclick="filterByDay('${day}')"
        class="px-7 py-4 rounded-2xl ${active ? 'bg-[#003087] text-white' : 'border'}">
        ${day}
        </button>`;
    });
}

function renderTable(data) {
    const tbody = document.getElementById('timetableBody');

    tbody.innerHTML = data.map(item => {
        const parts = item.lecturer.split('\\n');
        const name = parts[0];
        const phone = parts[1] || '';

        return `
        <tr class="table-row border-b">
            <td>${item.day}</td>
            <td>${item.time}</td>
            <td class="font-semibold">${item.course}</td>
            <td>
                ${name}<br>
                ${phone ? `<a href="tel:${phone}" class="text-blue-600">Call</a>` : ''}
            </td>
        </tr>`;
    }).join('');
}

function liveSearch() {
    const term = document.getElementById('searchInput').value.toLowerCase();

    renderTable(
        timetableData.filter(x =>
            x.course.toLowerCase().includes(term) ||
            x.lecturer.toLowerCase().includes(term) ||
            x.day.toLowerCase().includes(term)
        )
    );
}

function filterByDay(day) {
    if (activeDay === day) {
        activeDay = null;
        renderTable(timetableData);
    } else {
        activeDay = day;
        renderTable(timetableData.filter(x => x.day === day));
    }
    renderDayFilters();
}

loadData();
</script>

</body>
</html>

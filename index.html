<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>UNZA Timetable • 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Space+Grotesk:wght@700&display=swap');
        html, body { width: 1280px; min-width: 1280px; margin: 0 auto; overflow-x: auto; background: #f9fafb; }
        body { font-size: 22px; line-height: 1.6; }
        .header-font { font-family: 'Space Grotesk', sans-serif; }
        th { font-size: 24px; padding: 20px; }
        td { font-size: 22px; padding: 20px; }
        input, button { font-size: 20px; }
        .table-row:hover { background-color: #f0f7ff; }
    </style>
</head>
<body>
<header class="bg-gradient-to-r from-[#003087] to-[#0048a8] text-white py-10 shadow-lg">
    <div class="px-10 flex justify-between items-center">
        <div class="flex items-center gap-6">
            <img id="logoImg" src="images/logo.png" class="w-24 h-24 bg-white p-2 rounded-2xl">
            <div>
                <h1 class="header-font text-6xl">University of Zambia</h1>
                <p class="text-blue-200 text-xl">Student Timetable Portal • 2026</p>
            </div>
        </div>
        <button onclick="showFeedbackForm()" class="bg-white text-[#003087] px-8 py-5 rounded-3xl">Help Us Improve</button>
    </div>
</header>

<main class="px-10 py-14">
    <h1 class="header-font text-7xl text-center text-[#003087]">UNZA Academic Timetable 2026</h1>
    <div class="flex justify-center mt-4">
        <button onclick="showPrograms()" class="bg-[#003087] hover:bg-[#002266] text-white px-12 py-6 rounded-3xl text-3xl font-semibold shadow-lg flex items-center gap-3">
            <i class="fas fa-graduation-cap"></i> PROGRAMS
        </button>
    </div>
    <div class="mt-14">
        <input id="searchInput" type="text" placeholder="Search course, lecturer, or day..." class="w-full px-8 py-7 rounded-3xl border" onkeyup="liveSearch()">
    </div>
    <div class="my-12 flex gap-5 flex-wrap" id="dayFilters"></div>
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
        <table class="w-full">
            <thead class="bg-[#003087] text-white">
                <tr><th>Day</th><th>Time</th><th>Course</th><th>Lecturer</th></tr>
            </thead>
            <tbody id="timetableBody"></tbody>
        </table>
    </div>
</main>

<!-- PROGRAMS MODAL -->
<div id="programsModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-4xl relative max-h-[90vh] overflow-y-auto">
        <button onclick="closeProgramsModal()" class="absolute top-5 right-6 text-4xl font-bold text-gray-500 hover:text-black">×</button>
        <div id="programsContent" class="p-10"></div>
    </div>
</div>

<!-- Other modals -->
<div id="callModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">...</div>
<div id="feedbackModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">...</div>
<div id="submitFormModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">...</div>

<footer class="text-center py-12 text-gray-600 text-lg">
    <p>Created by <strong class="text-[#003087]">Amos Banda</strong></p>
    <p class="mt-2">
        <a href="tel:+260979077079" class="hover:text-blue-600">+260 979 077079</a> •
        <a href="mailto:bandaamos98@gmail.com" class="hover:text-blue-600">bandaamos98@gmail.com</a>
    </p>
</footer>

<script>
    let timetableData = [];
    let programData = {};
    let currentPhone = '';
    let activeDay = null;
    const allDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

    const programsData = {
        "CERTIFICATE (2 YEARS)": ["Early Childhood Education","Business Administration","Sales and Marketing","Finance and Accounting","Purchasing and Supply Management","Social Work","Human Resource Management","Project Planning and Management","Public Administration","Computer Science","Records Management","Guidance and Counselling","Public Health"],
        "DIPLOMA (3 YEARS)": ["Business Administration","Computer Science and Information Management","Early Childhood Education","Finance and Accounting","Human Resource Management","Public Health","Guidance and Counselling","Public Administration","Purchasing and Supply Management","Records Management","Sales and Marketing","Social Work"]
    };

    // ==================== YOUR COURSE DATA ====================
    const courseStructure = {
        "Early Childhood Education": {
            "1st Year": [
                { code: "ECE 1110", title: "Introduction to Early Childhood Development and Education" },
                { code: "ECE 1011", title: "Sociology of Education" },
                { code: "ECE 1012", title: "Education Psychology" },
                { code: "AED 1350", title: "Language and Communication Skills" },
                { code: "ECE 1120", title: "Special Needs Education in Early Childhood Education" },
                { code: "DSC 10111", title: "Computer Application and Concepts" }
            ]
        },
        "Business Administration": {
            "1st Year": [ /* your 6 courses */ 
                { code: "BDA 1011", title: "Business Communication" },
                { code: "DBA 1040", title: "Business Mathematics and Statistics" },
                { code: "DAF 1030", title: "Financial Accounting" },
                { code: "DBA 1021", title: "Introduction to Information Management and Technology" },
                { code: "DBA 10542", title: "Principles of Management" },
                { code: "DSM 1012", title: "Principle of Marketing" }
            ],
            "2nd Year": [ /* your 6 courses */ 
                { code: "DBA 2052", title: "Business Environment" },
                { code: "DBA 2021", title: "Business Economics" },
                { code: "DAF 2060", title: "Business and Company Law" },
                { code: "DAE 2011", title: "Research Methods" },
                { code: "DAF 2041", title: "Cost Accounting" },
                { code: "DAF 2050", title: "Financial Management" }
            ],
            "3rd Year": [ /* your 8 courses */ 
                { code: "DBA 3012", title: "International Business" },
                { code: "DBA 3015", title: "Entrepreneurship" },
                { code: "DAF 3011", title: "Investment Analysis and Portfolio Management" },
                { code: "DBA 3021", title: "Strategic Management" },
                { code: "DBA 3022", title: "Decision Making Techniques" },
                { code: "DBS 3035", title: "Corporate Governance and Business Ethics" },
                { code: "DHR 3015", title: "Organisation Behaviour" },
                { code: "DAE 3015", title: "Research Methods" }
            ]
        },
        // Add the rest of your programs here the same way (Sales and Marketing, Finance and Accounting, etc.)
        // For brevity I showed the pattern. You can copy-paste the others from my previous response.
        "Sales and Marketing": { "1st Year": [ /* ... */ ], "2nd Year": [ /* ... */ ] },
        "Finance and Accounting": { "1st Year": [ /* ... */ ], "2nd Year": [ /* ... */ ], "3rd Year": [ /* ... */ ] },
        "Purchasing and Supply Management": { "1st Year": [ /* ... */ ], "2nd Year": [ /* ... */ ], "3rd Year": [ /* ... */ ] },
        "Social Work": { "1st Year": [ /* ... */ ], "2nd Year": [ /* ... */ ] },
        "Human Resource Management": { "1st Year": [ /* ... */ ] },
        "Project Planning and Management": { "1st Year": [ /* ... */ ] },
        "Public Administration": { "1st Year": [ /* ... */ ], "2nd Year": [ /* ... */ ] },
        "Computer Science": { "1st Year": [ /* ... */ ], "2nd Year": [ /* ... */ ] },
        "Records Management": { "1st Year": [ /* ... */ ], "2nd Year": [ /* ... */ ] },
        "Guidance and Counselling": { "1st Year": [ /* ... */ ], "2nd Year": [ /* ... */ ] },
        "Public Health": { "1st Year": [ /* ... */ ], "2nd Year": [ /* ... */ ] }
    };

    async function loadData() {
        try {
            const res = await fetch('lecture.json');
            const data = await res.json();
            timetableData = data.timetable || [];
        } catch(e) { console.log("lecture.json not found"); }

        const todayIndex = new Date().getDay();
        const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        activeDay = dayNames[todayIndex] || "Monday";

        renderDayFilters();
        renderTable(timetableData.filter(x => x.day === activeDay));
    }

    function renderDayFilters() {
        const container = document.getElementById('dayFilters');
        container.innerHTML = '';
        allDays.forEach(day => {
            const isActive = activeDay === day;
            const btnClass = isActive ? "px-7 py-4 bg-[#003087] text-white rounded-2xl shadow-md" : "px-7 py-4 border border-gray-300 hover:border-[#003087] text-gray-700 rounded-2xl";
            container.innerHTML += `<button onclick="filterByDay('${day}')" class="${btnClass}">${day}</button>`;
        });
    }

    function renderTable(data) {
        const tbody = document.getElementById('timetableBody');
        tbody.innerHTML = data.map(item => {
            const parts = (item.lecturer || '').split('\n');
            const name = parts[0] || 'N/A';
            const phone = parts[1] || '';
            return `<tr class="table-row border-b">
                <td>${item.day || ''}</td>
                <td>${item.time || ''}</td>
                <td class="font-semibold">${item.course || ''}</td>
                <td>
                    <div class="mb-3">${name}</div>
                    ${phone ? `<button onclick="prepareCall('${name}','${phone}')" class="text-blue-600 flex items-center gap-2"><i class="fas fa-phone"></i> Call Lecturer</button>` : ''}
                </td>
            </tr>`;
        }).join('');
    }

    function prepareCall(name, phone) {
        currentPhone = phone;
        // Add your modal logic here if needed
        alert(`Calling ${name} → ${phone}`);
    }

    function liveSearch() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = timetableData.filter(x => 
            (x.course || '').toLowerCase().includes(term) || 
            (x.lecturer || '').toLowerCase().includes(term) || 
            (x.day || '').toLowerCase().includes(term)
        );
        renderTable(filtered);
    }

    function filterByDay(day) {
        activeDay = (activeDay === day) ? null : day;
        renderDayFilters();
        const filtered = activeDay ? timetableData.filter(x => x.day === activeDay) : timetableData;
        renderTable(filtered);
    }

    // ====================== PROGRAMS MODAL FUNCTIONS ======================
    function showPrograms() {
        document.getElementById('programsModal').classList.remove('hidden');
        renderCategories();
    }

    function closeProgramsModal() {
        document.getElementById('programsModal').classList.add('hidden');
    }

    function renderCategories() {
        const content = document.getElementById('programsContent');
        content.innerHTML = `
            <h2 class="text-4xl font-bold text-center mb-10 text-[#003087]">Our Academic Programs</h2>
            <div class="grid grid-cols-2 gap-8">
                <button onclick="showCategory('CERTIFICATE (2 YEARS)')" class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-8 rounded-3xl text-left hover:scale-105 transition">
                    <div class="text-3xl font-semibold">CERTIFICATE</div><div class="text-xl opacity-90 mt-2">2 YEARS</div>
                </button>
                <button onclick="showCategory('DIPLOMA (3 YEARS)')" class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-8 rounded-3xl text-left hover:scale-105 transition">
                    <div class="text-3xl font-semibold">DIPLOMA</div><div class="text-xl opacity-90 mt-2">3 YEARS</div>
                </button>
            </div>`;
    }

    function showCategory(cat) {
        const content = document.getElementById('programsContent');
        const courses = programsData[cat] || [];
        let html = `<div class="flex items-center justify-between mb-8">
            <h2 class="text-4xl font-bold text-[#003087]">${cat}</h2>
            <button onclick="renderCategories()" class="text-[#003087] hover:underline flex items-center gap-2 text-xl">← Back</button>
        </div><div class="space-y-6">`;

        courses.forEach(course => {
            html += `<button onclick="showCourseYears('${cat}', '${course}')" class="w-full flex justify-between items-center bg-gray-50 p-6 rounded-3xl border hover:border-[#003087] text-left">
                <div class="text-2xl font-medium">${course}</div>
                <i class="fas fa-chevron-right text-2xl text-gray-400"></i>
            </button>`;
        });
        html += `</div>`;
        content.innerHTML = html;
    }

    function showCourseYears(cat, course) {
        const content = document.getElementById('programsContent');
        let years = cat.includes("2 YEARS") ? ["1st Year", "2nd Year"] : ["1st Year", "2nd Year", "3rd Year"];

        let html = `<div class="flex items-center justify-between mb-8">
            <div>
                <h2 class="text-4xl font-bold text-[#003087]">${cat}</h2>
                <h3 class="text-2xl text-gray-600">${course}</h3>
            </div>
            <button onclick="showCategory('${cat}')" class="text-[#003087] hover:underline flex items-center gap-2 text-xl">← Back</button>
        </div><div class="space-y-6">`;

        years.forEach(year => {
            html += `<button onclick="showYearOptions('${cat}', '${course}', '${year}')" class="w-full flex justify-between items-center bg-gray-50 p-6 rounded-3xl border hover:border-[#003087] text-left">
                <div class="text-2xl font-medium">${year}</div>
                <i class="fas fa-chevron-right text-2xl text-gray-400"></i>
            </button>`;
        });
        html += `</div>`;
        content.innerHTML = html;
    }

    function showYearOptions(cat, course, year) {
        const content = document.getElementById('programsContent');
        content.innerHTML = `
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h2 class="text-4xl font-bold text-[#003087]">${cat}</h2>
                    <h3 class="text-2xl text-gray-600">${course} – ${year}</h3>
                </div>
                <button onclick="showCourseYears('${cat}', '${course}')" class="text-[#003087] hover:underline flex items-center gap-2 text-xl">← Back to Years</button>
            </div>
            <div class="grid grid-cols-2 gap-8">
                <button onclick="showCoursesList('${cat}', '${course}', '${year}')" class="bg-gradient-to-br from-emerald-600 to-teal-700 text-white p-10 rounded-3xl text-left hover:scale-105 transition shadow-lg">
                    <i class="fas fa-book text-5xl mb-4"></i>
                    <div class="text-4xl font-semibold mb-2">Courses</div>
                    <div class="text-xl opacity-90">View all courses for ${year}</div>
                </button>
                <button onclick="showYearTimetable('${cat}', '${course}', '${year}')" class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-10 rounded-3xl text-left hover:scale-105 transition shadow-lg">
                    <i class="fas fa-calendar-alt text-5xl mb-4"></i>
                    <div class="text-4xl font-semibold mb-2">Timetable</div>
                    <div class="text-xl opacity-90">View class schedule for ${year}</div>
                </button>
            </div>`;
    }

    function showCoursesList(cat, course, year) {
        const content = document.getElementById('programsContent');
        const list = courseStructure[course] && courseStructure[course][year] ? courseStructure[course][year] : [];

        let html = `
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h2 class="text-4xl font-bold text-[#003087]">${cat}</h2>
                    <h3 class="text-2xl text-gray-600">${course} – ${year}</h3>
                </div>
                <button onclick="showYearOptions('${cat}', '${course}', '${year}')" class="text-[#003087] hover:underline flex items-center gap-2 text-xl">← Back</button>
            </div>`;

        if (list.length === 0) {
            html += `<div class="bg-white rounded-3xl shadow-xl p-10 text-center text-3xl text-gray-500">No courses added yet for this year.</div>`;
        } else {
            html += `<div class="bg-white rounded-3xl shadow-xl p-8">
                <div class="flex justify-between items-center mb-6">
                    <h4 class="text-3xl font-semibold">Course List</h4>
                    <span class="bg-[#003087] text-white px-6 py-2 rounded-2xl text-2xl">${list.length} Courses</span>
                </div>
                <ol class="space-y-5 text-2xl">`;
            
            list.forEach((c, i) => {
                html += `<li class="flex gap-4"><span class="font-bold text-[#003087]">${i+1}.</span> <strong>${c.code}</strong> - ${c.title}</li>`;
            });
            html += `</ol></div>`;
        }
        content.innerHTML = html;
    }

    function showYearTimetable(cat, course, year) {
        const content = document.getElementById('programsContent');
        content.innerHTML = `
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h2 class="text-4xl font-bold text-[#003087]">${cat}</h2>
                    <h3 class="text-2xl text-gray-600">${course} – ${year}</h3>
                </div>
                <button onclick="showYearOptions('${cat}', '${course}', '${year}')" class="text-[#003087] hover:underline flex items-center gap-2 text-xl">← Back</button>
            </div>
            <div class="bg-white rounded-3xl shadow-xl p-10 text-center">
                <p class="text-3xl text-gray-500 mb-8">No timetable has been added yet for this program and year.</p>
                <button onclick="openSubmitForm()" class="bg-[#003087] hover:bg-[#002266] text-white px-12 py-6 rounded-3xl text-3xl font-semibold shadow-lg flex items-center gap-3 mx-auto">
                    <i class="fas fa-plus"></i> Add Timetable
                </button>
            </div>`;
    }

    function showFeedbackForm() { alert("Feedback form coming soon!"); }
    function openSubmitForm() { alert("Submit form modal would open here"); }

    // Start the app
    loadData();
</script>
</body>
</html>

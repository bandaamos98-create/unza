<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNZA Timetable • 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        input, textarea {
            -webkit-user-select: auto;
            -khtml-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }
        
        html, body {
            width: 100%;
            min-width: 320px;
            max-width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        
        body {
            font-size: 16px;
            line-height: 1.5;
            color: #1e293b;
        }
        
        .header-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .mobile-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 16px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .card:active {
            transform: scale(0.98);
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            text-decoration: none;
            min-height: 52px;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #003087 0%, #0048a8 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #003087;
            border: 2px solid #e2e8f0;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 16px 48px 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #003087;
            box-shadow: 0 0 0 3px rgba(0, 48, 135, 0.1);
        }
        
        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        
        .day-filter {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            white-space: nowrap;
        }
        
        .day-filter.active {
            background: #003087;
            color: white;
        }
        
        .day-filter:not(.active) {
            background: #f1f5f9;
            color: #64748b;
            border-color: #e2e8f0;
        }
        
        .class-card {
            margin-bottom: 16px;
            padding: 20px;
            border-left: 4px solid #003087;
        }
        
        .class-time {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .course-code {
            font-size: 18px;
            font-weight: 700;
            color: #003087;
            margin-bottom: 8px;
        }
        
        .course-name {
            font-size: 14px;
            color: #475569;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .lecturer-name {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }
        
        .call-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .call-btn:active {
            transform: scale(0.95);
            background: #059669;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }
        
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            color: #64748b;
            cursor: pointer;
            padding: 4px;
        }
        
        .floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #003087 0%, #0048a8 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(0, 48, 135, 0.3);
            z-index: 999;
        }
        
        .program-list {
            max-height: 60vh;
            overflow-y: auto;
        }
        
        .program-item {
            padding: 16px 20px;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        .program-item:active {
            background: #f8fafc;
        }
        
        @media (max-width: 480px) {
            .mobile-container {
                padding: 0 12px;
            }
            
            body {
                font-size: 14px;
            }
            
            .btn {
                padding: 14px 20px;
                font-size: 14px;
                min-height: 48px;
            }
            
            .search-input {
                padding: 14px 44px 14px 16px;
                font-size: 14px;
            }
            
            .class-card {
                padding: 16px;
            }
            
            .course-code {
                font-size: 16px;
            }
            
            .course-name {
                font-size: 13px;
            }
            
            .lecturer-name {
                font-size: 14px;
            }
        }
        
        @media (min-width: 768px) {
            .desktop-only {
                display: block;
            }
            
            .mobile-only {
                display: none;
            }
        }
        
        @media (max-width: 767px) {
            .desktop-only {
                display: none;
            }
            
            .mobile-only {
                display: block;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="bg-gradient-to-r from-[#003087] to-[#0048a8] text-white">
        <div class="mobile-container py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="images/logo.png" alt="UNZA Logo" class="w-12 h-12 bg-white p-2 rounded-lg">
                    <div>
                        <h1 class="header-font text-lg font-bold">UNZA</h1>
                        <p class="text-xs text-blue-200">Timetable 2026</p>
                    </div>
                </div>
                <button onclick="showPrograms()" class="bg-white/20 backdrop-blur text-white px-4 py-2 rounded-lg text-sm font-medium">
                    <i class="fas fa-th-large mr-2"></i>Programs
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="mobile-container py-6">
        <!-- Page Title -->
        <div class="text-center mb-6">
            <h2 class="header-font text-2xl font-bold text-[#003087] mb-2">Academic Timetable</h2>
            <p class="text-gray-600">Find your classes quickly</p>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="showSubmitTimetable()" class="btn btn-primary">
                <i class="fas fa-plus"></i>
                <span>Add Class</span>
            </button>
            <button onclick="showFeedbackForm()" class="btn btn-secondary">
                <i class="fas fa-comment-dots"></i>
                <span>Help</span>
            </button>
        </div>

        <!-- Search -->
        <div class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search courses, lecturers..."
                class="search-input"
                onkeyup="liveSearch()"
            >
            <i class="fas fa-search search-icon"></i>
        </div>

        <!-- Day Filters -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2" id="dayFilters">
            <!-- Day filters will be inserted here -->
        </div>

        <!-- Classes List -->
        <div id="classesList" class="space-y-4">
            <!-- Classes will be inserted here -->
        </div>
    </main>

    <!-- Programs Modal -->
    <div id="programsModal" class="modal hidden">
        <div class="modal-content">
            <button onclick="closeProgramsModal()" class="modal-close">
                <i class="fas fa-times"></i>
            </button>
            <div class="p-6">
                <h3 class="header-font text-xl font-bold text-[#003087] mb-4">Academic Programs</h3>
                <div class="program-list" id="programsList">
                    <!-- Programs will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Submit Timetable Modal -->
    <div id="submitModal" class="modal hidden">
        <div class="modal-content">
            <button onclick="closeSubmitModal()" class="modal-close">
                <i class="fas fa-times"></i>
            </button>
            <div class="p-6">
                <h3 class="header-font text-xl font-bold text-[#003087] mb-4">Submit Timetable</h3>
                <iframe 
                    src="https://docs.google.com/forms/d/e/1FAIpQLSfpyilXKH-4ZOhuAillwXChXtG3O_wnNAfItsW3WUEju7jvmQ/viewform?embedded=true" 
                    width="100%" 
                    height="500" 
                    frameborder="0" 
                    marginheight="0" 
                    marginwidth="0">
                    Loading…
                </iframe>
            </div>
        </div>
    </div>

    <!-- Feedback Modal -->
    <div id="feedbackModal" class="modal hidden">
        <div class="modal-content">
            <button onclick="closeFeedbackModal()" class="modal-close">
                <i class="fas fa-times"></i>
            </button>
            <div class="p-6">
                <h3 class="header-font text-xl font-bold text-[#003087] mb-4">Help Us Improve</h3>
                <iframe 
                    src="https://docs.google.com/forms/d/e/1FAIpQLSfvxXjelmBCdbdXixV1cGSpVfdhcqbtdeeLFSxshzDX31hlxQ/viewform?embedded=true" 
                    width="100%" 
                    height="500" 
                    frameborder="0" 
                    marginheight="0" 
                    marginwidth="0">
                    Loading…
                </iframe>
            </div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button onclick="scrollToTop()" class="floating-btn mobile-only">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Footer -->
    <footer class="bg-gray-100 text-center py-6 mt-12">
        <div class="mobile-container">
            <p class="text-sm text-gray-600 mb-2">
                Created by <strong class="text-[#003087]">Amos Banda</strong> with ❤️
            </p>
            <div class="flex justify-center gap-4 text-sm">
                <a href="tel:+260979077079" class="text-[#003087] hover:underline">
                    <i class="fas fa-phone mr-1"></i>+260 979 077079
                </a>
                <a href="mailto:bandaamos98@gmail.com" class="text-[#003087] hover:underline">
                    <i class="fas fa-envelope mr-1"></i>Email
                </a>
            </div>
        </div>
    </footer>

    <script>
        let timetableData = [];
        let activeDay = null;
        const allDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        
        const programsData = {
            "DIPLOMA PROGRAMS": [
                "Early Childhood Education", "Business Administration", "Sales and Marketing", 
                "Finance and Accounting", "Purchasing and Supply Management", "Social Work", 
                "Human Resource Management", "Project Planning and Management", "Public Administration", 
                "Computer Science", "Records Management", "Guidance and Counselling", "Public Health"
            ]
        };

        async function loadData() {
            try {
                const res = await fetch('lecture.json');
                const data = await res.json();
                timetableData = data.timetable || [];
            } catch (e) {
                console.error("Failed to load lecture.json", e);
                timetableData = [];
            }
            
            // Set today as active day
            const todayIndex = new Date().getDay();
            const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
            activeDay = dayNames[todayIndex] || "Monday";
            
            renderDayFilters();
            renderClasses();
        }

        function renderDayFilters() {
            const container = document.getElementById('dayFilters');
            container.innerHTML = '';
            
            // Add "All" button
            const allBtn = document.createElement('button');
            allBtn.className = `day-filter ${!activeDay ? 'active' : ''}`;
            allBtn.textContent = 'All';
            allBtn.onclick = () => filterByDay(null);
            container.appendChild(allBtn);
            
            // Add day buttons
            allDays.forEach(day => {
                const btn = document.createElement('button');
                btn.className = `day-filter ${activeDay === day ? 'active' : ''}`;
                btn.textContent = day.substring(0, 3); // Show first 3 letters on mobile
                btn.onclick = () => filterByDay(day);
                container.appendChild(btn);
            });
        }

        function renderClasses() {
            const container = document.getElementById('classesList');
            const filtered = activeDay 
                ? timetableData.filter(item => item.day === activeDay)
                : timetableData;
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="card empty-state">
                        <i class="fas fa-calendar-times"></i>
                        <h3 class="text-lg font-semibold mb-2">No Classes Found</h3>
                        <p>No classes scheduled for ${activeDay || 'this filter'}</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filtered.map(item => {
                const lecturerParts = (item.lecturer || '').split('\n');
                const name = lecturerParts[0] || 'Not Assigned';
                const phone = lecturerParts[1] || '';
                
                return `
                    <div class="card class-card">
                        <div class="class-time">
                            <i class="fas fa-clock mr-2"></i>${item.day || ''} • ${item.time || ''}
                        </div>
                        <div class="course-code">${item.course || ''}</div>
                        ${item.fullName ? `<div class="course-name">${item.fullName}</div>` : ''}
                        <div class="lecturer-name">${name}</div>
                        ${phone ? `
                            <a href="tel:${phone}" class="call-btn">
                                <i class="fas fa-phone"></i>
                                Call Lecturer
                            </a>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function liveSearch() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!term) {
                renderClasses();
                return;
            }
            
            const filtered = timetableData.filter(item => 
                (item.course || '').toLowerCase().includes(term) ||
                (item.fullName || '').toLowerCase().includes(term) ||
                (item.lecturer || '').toLowerCase().includes(term) ||
                (item.day || '').toLowerCase().includes(term)
            );
            
            renderFilteredClasses(filtered);
        }

        function renderFilteredClasses(filtered) {
            const container = document.getElementById('classesList');
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="card empty-state">
                        <i class="fas fa-search"></i>
                        <h3 class="text-lg font-semibold mb-2">No Results Found</h3>
                        <p>Try searching with different keywords</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filtered.map(item => {
                const lecturerParts = (item.lecturer || '').split('\n');
                const name = lecturerParts[0] || 'Not Assigned';
                const phone = lecturerParts[1] || '';
                
                return `
                    <div class="card class-card">
                        <div class="class-time">
                            <i class="fas fa-clock mr-2"></i>${item.day || ''} • ${item.time || ''}
                        </div>
                        <div class="course-code">${item.course || ''}</div>
                        ${item.fullName ? `<div class="course-name">${item.fullName}</div>` : ''}
                        <div class="lecturer-name">${name}</div>
                        ${phone ? `
                            <a href="tel:${phone}" class="call-btn">
                                <i class="fas fa-phone"></i>
                                Call Lecturer
                            </a>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function filterByDay(day) {
            activeDay = (activeDay === day) ? null : day;
            renderDayFilters();
            renderClasses();
        }

        function showPrograms() {
            document.getElementById('programsModal').classList.remove('hidden');
            renderProgramsList();
        }

        function closeProgramsModal() {
            document.getElementById('programsModal').classList.add('hidden');
        }

        function renderProgramsList() {
            const container = document.getElementById('programsList');
            const programs = programsData["DIPLOMA PROGRAMS"] || [];
            
            container.innerHTML = programs.map(program => `
                <div class="program-item" onclick="selectProgram('${program}')">
                    <div class="font-medium">${program}</div>
                </div>
            `).join('');
        }

        function selectProgram(program) {
            closeProgramsModal();
            // Filter timetable by program (simplified for mobile)
            const filtered = timetableData.filter(item => 
                (item.fullName || '').toLowerCase().includes(program.toLowerCase().split(' ')[0]) ||
                (item.course || '').substring(0, 3) === program.substring(0, 3).toUpperCase()
            );
            renderFilteredClasses(filtered);
        }

        function showSubmitTimetable() {
            document.getElementById('submitModal').classList.remove('hidden');
        }

        function closeSubmitModal() {
            document.getElementById('submitModal').classList.add('hidden');
        }

        function showFeedbackForm() {
            document.getElementById('feedbackModal').classList.remove('hidden');
        }

        function closeFeedbackModal() {
            document.getElementById('feedbackModal').classList.add('hidden');
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Close modals when clicking outside
        document.addEventListener('click', function(event) {
            if (event.target.classList.contains('modal')) {
                closeProgramsModal();
                closeSubmitModal();
                closeFeedbackModal();
            }
        });

        // Initialize app
        loadData();
    </script>
</body>
</html>
